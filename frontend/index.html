<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document Finder</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">INTERNAL PROCESS DOCUMENTATION</p>
        <h1>Document Finder</h1>
        <p class="intro">Find the SOP or process document you need, then open the original file.</p>
      </header>
      <form id="search-form" novalidate>
        <label for="query">What process are you looking for?</label>
        <div class="search-row">
          <input id="query" name="query" type="search" placeholder="e.g. how do I create a new part?" autocomplete="off" required>
          <button id="search-button" type="submit">Search</button>
        </div>
        <p id="validation-message" class="message error" role="alert" hidden></p>
      </form>
      <section id="clarification" class="clarification" aria-live="polite" hidden>
        <p id="clarification-question" class="clarification-question"></p>
        <div id="clarification-options" class="clarification-options"></div>
      </section>
      <section id="status" class="message" aria-live="polite" hidden></section>
      <section id="results" aria-live="polite" aria-label="Search results"></section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
