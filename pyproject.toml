[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-finder"
version = "0.1.0"
description = "Phase 1 ingestion for manufacturing process-document discovery"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2", "fastapi>=0.115", "uvicorn>=0.30", "PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vector = ["torch>=2.4", "transformers>=4.51", "faiss-cpu>=1.10"]
ocr = ["rapidocr-onnxruntime>=1.4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
